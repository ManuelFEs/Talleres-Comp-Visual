<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Three.js Basic Scene</title>
		<style>
			html, body, #three-canvas { height: 100%; }
			body { margin: 0; background: #111; color: #fff; font-family: Arial, Helvetica, sans-serif; }
		</style>
		<!-- Import map to remap bare specifiers to local node_modules -->

			"imports": {
				"three": "./node_modules/three/build/three.module.js",
				"three/": "./node_modules/three/"
			}
		}
		</script>
	</head>
	<body>
		<noscript>This demo requires JavaScript.</noscript>
		<script type="module" src="./main.js"></script>
	</body>
</html>
